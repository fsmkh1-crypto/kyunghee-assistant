name: Desktop Package

on:
  workflow_dispatch:
  push:
    branches:
      - ui/dark-kyunghee-redesign
    paths:
      - '*.py'
      - 'assistant_ai/**'
      - 'tests/**'
      - 'docs/**'
      - 'desktop_gallery_final.py'
      - 'desktop_gallery.py'
      - 'desktop_compact.py'
      - 'desktop_app.py'
      - 'compact_runtime_features.py'
      - 'asset_rotation.py'
      - 'app.py'
      - 'app_brand.py'
      - 'asset_manager.py'
      - 'break_reminder.py'
      - 'messages.py'
      - 'settings.py'
      - 'state.py'
      - 'timer_engine.py'
      - 'windows_display.py'
      - 'windows_idle.py'
      - 'workday.py'
      - 'requirements.txt'
      - 'RUN.cmd'
      - 'RUN_DEBUG.cmd'
      - 'INSTALL_ASSETS.cmd'
      - 'install_asset_pack.py'
      - 'assets/**'
      - '.github/workflows/desktop-package.yml'

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone Windows app
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --windowed
          --name SeungaTimer
          --add-data "assets;assets"
          desktop_gallery_final.py
      - name: Exercise packaged UI and DPI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "seunga-package-validation"
          $report = Join-Path $env:GITHUB_WORKSPACE "packaged-ui-report.json"
          $process = Start-Process -FilePath dist\SeungaTimer\SeungaTimer.exe -ArgumentList @("--self-test", $report) -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            if (Test-Path $report) { Get-Content $report }
            throw "Packaged UI tests failed with exit code $($process.ExitCode)."
          }
          Get-Content $report
      - name: Smoke-test packaged app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "seunga-package-normal-start"
          $process = Start-Process -FilePath dist\SeungaTimer\SeungaTimer.exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Packaged app exited during startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

          $logPath = Join-Path $env:APPDATA "KyungheeAssistant\kyunghee.log"
          if (Test-Path $logPath) {
            $errors = Select-String -Path $logPath -Pattern "asset failed|tick failed|Traceback| ERROR "
            if ($errors) {
              throw "Packaged app logged a startup or asset error: $($errors.Line -join '; ')"
            }
          }
      - name: Prepare package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item README.md dist\SeungaTimer\README.md
          Copy-Item LICENSE dist\SeungaTimer\LICENSE
          Copy-Item WINDOWS_SMOKE_TEST.md dist\SeungaTimer\
          Copy-Item docs dist\SeungaTimer\docs -Recurse
          Copy-Item packaged-ui-report.json dist\SeungaTimer\
      - uses: actions/upload-artifact@v4
        with:
          name: seunga-timer-2.1.0-windows-x64
          path: dist/SeungaTimer

