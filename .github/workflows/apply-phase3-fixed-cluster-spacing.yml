name: Apply Phase 3 fixed cluster spacing

on:
  push:
    paths:
      - '.github/workflows/apply-phase3-fixed-cluster-spacing.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/dark-kyunghee-redesign
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply fixed cluster spacing patch
        run: python tools/apply_phase3_fixed_cluster_spacing.py
      - name: Compile and test
        run: |
          python -m py_compile desktop_compact.py settings.py
          python -m unittest discover -s tests -v
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop_compact.py
          git diff --cached --quiet || git commit -m "Keep timer UI clustered across scales"
          git push origin HEAD:ui/dark-kyunghee-redesign
