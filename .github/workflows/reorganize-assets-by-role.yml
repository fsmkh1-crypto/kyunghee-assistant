name: Reorganize assets by role

on:
  push:
    paths:
      - 'tools/reorganize_assets_by_role.py'
      - '.github/workflows/reorganize-assets-by-role.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/dark-kyunghee-redesign
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Reorganize assets
        run: python tools/reorganize_assets_by_role.py
      - name: Compile and test
        run: |
          python -m py_compile asset_manager.py install_asset_pack.py desktop_compact.py
          python -m unittest discover -s tests -v
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add asset_manager.py install_asset_pack.py assets tests/test_asset_manager.py tests/test_runtime_assets.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Organize assets by role folders'
            git push origin HEAD:ui/dark-kyunghee-redesign
          fi
