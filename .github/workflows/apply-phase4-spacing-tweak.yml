name: Apply Phase 4 spacing tweak

on:
  push:
    branches:
      - ui/dark-kyunghee-redesign

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/dark-kyunghee-redesign
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply minimal visible-cluster spacing tweak
        shell: python
        run: |
          from pathlib import Path

          path = Path('desktop_compact.py')
          text = path.read_text(encoding='utf-8')
          old_gap = '        visible_gap = 12\n'
          new_gap = '        visible_gap = 6\n'
          old_message = '    def _message_bottom_gap(self) -> int:\n        return 16\n'
          new_message = '    def _message_bottom_gap(self) -> int:\n        return 10\n'
          if text.count(old_gap) != 1:
              raise SystemExit(f'expected one visible_gap = 12, found {text.count(old_gap)}')
          if text.count(old_message) != 1:
              raise SystemExit(f'expected one message bottom gap block, found {text.count(old_message)}')
          text = text.replace(old_gap, new_gap).replace(old_message, new_message)
          path.write_text(text, encoding='utf-8')
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-phase4-spacing-tweak.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop_compact.py .github/workflows/apply-phase4-spacing-tweak.yml
          git commit -m "Tighten visible cluster spacing"
          git push origin HEAD:ui/dark-kyunghee-redesign
