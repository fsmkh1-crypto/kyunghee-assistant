name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m py_compile desktop_app.py desktop_compact.py desktop_preview.py install_asset_pack.py app.py asset_manager.py break_reminder.py image_render.py messages.py settings.py state.py timer_engine.py windows_display.py windows_idle.py workday.py
      - name: Run unit and asset tests
        run: python -m unittest discover -s tests -v
      - name: Install PyInstaller
        if: matrix.os == 'windows-latest'
        run: python -m pip install pyinstaller
      - name: Build compact Windows app
        if: matrix.os == 'windows-latest'
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --windowed
          --name KyungheeTimer
          --add-data "assets;assets"
          desktop_compact.py
      - name: Smoke-test compact Windows app
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $process = Start-Process -FilePath dist\KyungheeTimer\KyungheeTimer.exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Packaged app exited during startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
      - name: Upload compact Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: kyunghee-timer-compact-windows
          path: dist/KyungheeTimer
          retention-days: 7
