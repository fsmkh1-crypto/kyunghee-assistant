name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m py_compile app.py asset_manager.py break_reminder.py messages.py settings.py state.py timer_engine.py windows_idle.py workday.py
      - name: Run unit and asset tests
        run: python -m unittest discover -s tests -v
