name: Update Phase 4 status documentation

on:
  push:
    paths:
      - '.github/workflows/update-phase4-status.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/dark-kyunghee-redesign
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update phase docs
        run: |
          python - <<'PY'
          from pathlib import Path

          project = Path('PROJECT_PHASES.md')
          text = project.read_text(encoding='utf-8')
          text = text.replace(
              'The visual gap between the clock/status group and Kyunghee is kept small and effectively fixed across scales (about 12 px target).',
              'The visual gap between the clock/status group and Kyunghee is kept small and effectively fixed across scales (about 6 px target).',
          )
          text = text.replace(
              '### Status: NEXT PHASE / READY TO START\n\nPlanned priority:',
              '### Status: IN PROGRESS / IMAGE-SET RUNTIME INTEGRATED\n\nImplemented so far:\n- App-owned multi-image sets per role/situation.\n- Multiple-file and folder import.\n- Random image selection when a role is re-entered, with stable display while the role remains active.\n- Fit/crop plus 9-way alignment controls.\n- Legacy single-image custom import preserved as fallback, followed by canonical approved assets.\n- Image-set cache/invalidation integrated into the compact runtime.\n- Ubuntu tests and Windows compile/tests/build/smoke passed after runtime integration.\n\nRemaining priority:',
          )
          text = text.replace('1. Multiple images per role/situation with random selection.\n2. Folder/set support.\n3. Fit/crop/alignment controls.\n4. Image preview in settings.\n5. Robust cache/invalidation for sets and previews.\n6. Keep app-owned imported copies as the default storage model.',
                              '1. Image preview in settings.\n2. Preview-specific cache/invalidation polish.\n3. Real-device visual check of the expanded image settings UI.\n4. Keep app-owned imported copies as the default storage model.')
          text = text.replace('10. Phase 4 is the next implementation phase.', '10. Phase 4 is in progress; image-set runtime integration is complete and settings preview is next.')
          project.write_text(text, encoding='utf-8')

          handoff = Path('PHASE4_HANDOFF.md')
          text = handoff.read_text(encoding='utf-8')
          text = text.replace('약 12px 정도의 작은 시각 간격', '약 6px 정도의 작은 시각 간격')
          text = text.replace('이제 Phase 4를 시작한다.', 'Phase 4는 현재 구현 중이다. 이미지 세트 저장 계층과 실제 compact runtime 연결까지 완료됐다.')
          text = text.replace('1. 역할/상황별 여러 이미지 등록 및 랜덤 선택\n2. 폴더/세트 단위 이미지 등록\n3. fit/crop/alignment 옵션\n4. 설정 화면 이미지 preview\n5. 이미지 set/preview용 cache/invalidation 정리\n6. app-owned imported copies 저장 원칙 유지',
                              '1. 설정 화면 이미지 preview\n2. preview 전용 cache/invalidation 마무리\n3. 확장된 이미지 설정 UI의 Windows 실화면 검증\n4. app-owned imported copies 저장 원칙 유지')
          text = text.replace('첫 작업은 `PROJECT_PHASES.md`, `PHASE4_HANDOFF.md`, PR #3, 현재 HEAD를 확인한 뒤 Phase 4 구현 계획을 짧게 정리하고 바로 시작해.',
                              '다음 작업은 현재 HEAD와 CI 상태를 확인한 뒤 설정 화면 이미지 preview부터 이어가.')
          handoff.write_text(text, encoding='utf-8')
          PY
      - name: Commit docs and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/update-phase4-status.yml
          git add PROJECT_PHASES.md PHASE4_HANDOFF.md .github/workflows/update-phase4-status.yml
          git commit -m "Mark Phase 4 image-set runtime integrated"
          git push origin HEAD:ui/dark-kyunghee-redesign
