name: Apply asset edge smoothing

on:
  push:
    branches:
      - ui/dark-kyunghee-redesign
    paths:
      - '.github/workflows/apply-asset-edge-smoothing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/dark-kyunghee-redesign
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply conservative built-in edge smoothing
        run: python tools/apply_asset_edge_smoothing.py
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and test
        run: |
          python -m py_compile image_render.py desktop_compact.py
          python -m unittest discover -s tests -v
      - name: Commit runtime patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image_render.py desktop_compact.py tests/test_image_render.py
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
          else
            git commit -m "Smooth built-in character edges conservatively"
            git push origin HEAD:ui/dark-kyunghee-redesign
          fi
