name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name "KyungheeAssistant" --add-data "assets;assets" app.py
      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist\KyungheeAssistant.exe package\KyungheeAssistant.exe
          Compress-Archive -Path package\KyungheeAssistant.exe -DestinationPath KyungheeAssistant-Windows.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KyungheeAssistant-Windows
          path: KyungheeAssistant-Windows.zip
          if-no-files-found: error
          retention-days: 7
