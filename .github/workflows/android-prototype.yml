name: Android UI Prototype

on:
  workflow_dispatch:
  push:
    branches:
      - ui/dark-kyunghee-redesign
    paths:
      - 'android-prototype/**'
      - '.github/workflows/android-prototype.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare character asset
        run: |
          mkdir -p android-prototype/app/src/main/res/drawable-nodpi
          cp assets/cheer_full.webp android-prototype/app/src/main/res/drawable-nodpi/cheer_full.webp

      - name: Build debug APK
        run: gradle -p android-prototype assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: kyunghee-ui-prototype-apk
          path: android-prototype/app/build/outputs/apk/debug/app-debug.apk
