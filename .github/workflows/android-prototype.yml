name: Android UI Prototype

on:
  workflow_dispatch:
  push:
    branches:
      - ui/dark-kyunghee-redesign
    paths:
      - 'android-prototype/**'
      - '.github/workflows/android-prototype.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare character asset as PNG
        run: |
          python -m pip install --quiet pillow
          mkdir -p android-prototype/app/src/main/res/drawable-nodpi
          python - <<'PY'
          from PIL import Image
          src = 'assets/cheer_full.webp'
          dst = 'android-prototype/app/src/main/res/drawable-nodpi/cheer_full.png'
          with Image.open(src) as im:
              im = im.convert('RGBA')
              im.save(dst, format='PNG', optimize=True)
          print('converted', src, '->', dst)
          PY

      - name: Build debug APK
        run: gradle -p android-prototype assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: kyunghee-ui-prototype-apk
          path: android-prototype/app/build/outputs/apk/debug/app-debug.apk
