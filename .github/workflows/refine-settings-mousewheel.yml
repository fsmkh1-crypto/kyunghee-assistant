name: Refine settings mousewheel

on:
  push:
    paths:
      - '.github/workflows/refine-settings-mousewheel.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/dark-kyunghee-redesign
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refine wheel binding
        run: python tools/refine_settings_mousewheel.py
      - name: Compile and test
        run: |
          python -m py_compile desktop_compact.py
          python -m unittest discover -s tests -v
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop_compact.py
          if git diff --cached --quiet; then
            echo "No implementation changes"
          else
            git commit -m "Keep settings wheel active over controls"
            git push origin HEAD:ui/dark-kyunghee-redesign
          fi
