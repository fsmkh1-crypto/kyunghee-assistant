name: Donor crawler sample

on:
  push:
    branches:
      - tools/donor-crawler-drive
    paths:
      - 'tools/donor_crawler/**'
      - '.github/workflows/donor-crawler-sample.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/donor_crawler/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/donor_crawler/requirements.txt

      - name: Collect ten page samples
        run: |
          rm -rf /tmp/donor-crawler-sample
          mkdir -p /tmp/donor-crawler-sample
          python tools/donor_crawler/page_sample.py \
            --pages-file tools/donor_crawler/sample_pages.txt \
            --limit 10 \
            --output-dir /tmp/donor-crawler-sample

      - name: Verify ten outputs
        run: |
          count=$(find /tmp/donor-crawler-sample -maxdepth 1 -name 'candidate_*.jpg' | wc -l)
          echo "candidate_count=$count"
          test "$count" -eq 10

      - name: Upload sample artifact
        uses: actions/upload-artifact@v4
        with:
          name: donor-crawler-sample
          path: /tmp/donor-crawler-sample
          if-no-files-found: error
          retention-days: 1
