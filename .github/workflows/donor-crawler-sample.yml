name: Donor crawler sample

on:
  push:
    branches:
      - tools/donor-crawler-drive
    paths:
      - 'tools/donor_crawler/**'
      - '.github/workflows/donor-crawler-sample.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/donor_crawler/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/donor_crawler/requirements.txt

      - name: Collect and rank sample
        run: |
          mkdir -p /tmp/donor-crawler-sample
          python tools/donor_crawler/donor_crawler.py \
            --queries-file tools/donor_crawler/queries.txt \
            --limit 10 \
            --candidate-pool 50 \
            --candidates-per-query 3 \
            --pages-per-query 8 \
            --images-per-page 4 \
            --output-dir /tmp/donor-crawler-sample \
            --manifest /tmp/donor-crawler-sample/manifest.csv \
            --dry-run

      - name: Upload sample artifact
        uses: actions/upload-artifact@v4
        with:
          name: donor-crawler-sample
          path: /tmp/donor-crawler-sample
          if-no-files-found: error
          retention-days: 1
