name: Update phase docs to Phase 5

on:
  push:
    paths:
      - '.github/workflows/update-phase-docs-to-phase5.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/dark-kyunghee-redesign
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update project phase document
        run: python tools/update_phase_docs_to_phase5.py
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_PHASES.md
          if git diff --cached --quiet; then
            echo "No documentation changes"
          else
            git commit -m "Close Phase 4 and start Phase 5"
            git push origin HEAD:ui/dark-kyunghee-redesign
          fi
