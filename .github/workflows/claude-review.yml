name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review PR with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            Review this pull request as an independent senior code reviewer.

            Focus on:
            - logic bugs and regressions
            - timer/state-machine errors and race conditions
            - Windows idle/sleep/resume edge cases
            - persistence and SQLite/schema issues
            - incorrect manual-away / snooze / auto-resume behavior
            - exception handling and silent failures
            - security or privacy issues
            - missing or weak tests

            Do not nitpick formatting unless it affects correctness or maintainability.
            For each real issue, explain severity, affected file/area, why it is a problem,
            and the smallest safe fix. If no blocking issue exists, say so clearly.
