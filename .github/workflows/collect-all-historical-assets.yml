name: Collect All Historical Character Assets

on:
  push:
    branches:
      - "tools/collect-all-assets-20260930"
    paths:
      - ".github/workflows/collect-all-historical-assets.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch every branch and tag
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --force --prune

      - name: Collect assets
        run: python tools/collect_all_historical_assets.py

      - name: Create ZIP
        run: zip -r kyunghee-assistant-all-assets-20260930.zip asset_archive

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: kyunghee-assistant-all-assets-20260930
          path: kyunghee-assistant-all-assets-20260930.zip
          if-no-files-found: error
          retention-days: 30
