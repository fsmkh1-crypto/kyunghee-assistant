name: Rebuild quality assets temp

on:
  push:
    branches:
      - asset-quality-rebuild-20260905
    paths:
      - .github/quality-assets-trigger

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      ATLAS_URL: 'https://oaisdmntprjapaneast.blob.core.windows.net/files/00000000-aae8-8209-85b0-d214f4253f1b/raw?se=2026-09-04T19%3A46%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=b26df805-d27c-41c2-a339-ca2ea15ee154&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T02%3A37%3A12Z&ske=2026-09-05T02%3A37%3A12Z&sks=b&skv=2026-02-06&sig=UtRRzFY1liwU9ObdscXl/892dJUPABUgetcVzzZNdWw%3D'
      ATLAS_SHA256: '2f2133387fc3a6c4215be0cecc4e03f66887f5417d47b3e1099cda564e9f6d62'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install asset tooling dependencies
        run: |
          python -m pip install -r tools/requirements-asset-import.txt

