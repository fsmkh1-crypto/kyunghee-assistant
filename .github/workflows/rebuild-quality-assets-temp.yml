          ]

          atlas = Image.open(atlas_path).convert('RGBA')
          if atlas.size != (3150, 3386):
              raise SystemExit(f'unexpected atlas size: {atlas.size}')

          for rel, box, expected_sha in items:
              out = Path(rel)
              out.parent.mkdir(parents=True, exist_ok=True)
              atlas.crop(box).save(out, 'PNG', optimize=True)
              got = hashlib.sha256(out.read_bytes()).hexdigest()
              if got != expected_sha:
                  raise SystemExit(f'{rel}: SHA256 mismatch {got} != {expected_sha}')
              print(rel, got)
