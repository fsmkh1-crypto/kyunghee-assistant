      - name: Rebuild numbered-asset index
        run: python tools/backfill_asset_index.py

      - name: Verify exact maintenance diff
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          expected = {'assets/asset_index.json'}
          roles = ['default','cheer','rest','away','warning','leave','stats','settings','alert','profile']
          for n in range(1,6):
              s = f'{n:02d}'
              expected.update(f'assets/{r}/{r}_{s}.png' for r in roles)
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected diff\nmissing={sorted(expected-changed)}\nextra={sorted(changed-expected)}')
          print(f'validated {len(changed)} changed paths')
          PY

      - name: Commit staging result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/asset_index.json assets/*/*_[0-9][0-9].png
          test "$(git diff --cached --name-only | wc -l)" -eq 51
          git commit -m 'Stage quality-improved character assets 01-05'
          git push
