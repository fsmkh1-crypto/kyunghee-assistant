name: Apply asset selection controls

on:
  push:
    branches:
      - ui/dark-kyunghee-redesign
    paths:
      - '.github/workflows/apply-asset-selection-controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/dark-kyunghee-redesign
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply canonical asset selection fix
        run: python tools/apply_canonical_asset_selection_fix.py
      - name: Compile and test
        run: |
          python -m py_compile asset_manager.py settings.py desktop_compact.py tools/import_asset_sheet.py
          python -m unittest discover -s tests -v
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset_manager.py settings.py desktop_compact.py tests/test_asset_manager.py tests/test_settings.py
          git diff --cached --quiet && exit 0
          git commit -m "Restore canonical Kyunghee asset selection"
          git push origin HEAD:ui/dark-kyunghee-redesign
