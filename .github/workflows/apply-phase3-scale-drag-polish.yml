name: Apply Phase 3 scale and drag polish

on:
  push:
    paths:
      - '.github/workflows/apply-phase3-scale-drag-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/dark-kyunghee-redesign
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Phase 3 scale/drag polish
        run: python tools/apply_phase3_scale_drag_polish.py
      - name: Compile and test
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile desktop_compact.py settings.py
          python -m unittest discover -s tests -v
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop_compact.py settings.py
          git commit -m "Polish Phase 3 scaling and character drag"
          git push origin HEAD:ui/dark-kyunghee-redesign
