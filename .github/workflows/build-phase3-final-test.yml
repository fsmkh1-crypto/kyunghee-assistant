name: Build Phase 3 final test

on:
  push:
    paths:
      - '.github/workflows/build-phase3-final-test.yml'
  workflow_dispatch:

# Trigger build for the clock-follow-character Phase 3 test package.
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/dark-kyunghee-redesign
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Compile and test
        run: |
          python -m py_compile desktop_compact.py settings.py
          python -m unittest discover -s tests -v
      - name: Build Windows app
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --windowed
          --name KyungheeTimer
          --add-data "assets;assets"
          desktop_compact.py
      - name: Smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $process = Start-Process -FilePath dist\KyungheeTimer\KyungheeTimer.exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Packaged app exited during startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: kyunghee-timer-phase3-final-test
          path: dist/KyungheeTimer
          retention-days: 7
