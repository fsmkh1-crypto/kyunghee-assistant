name: Import character assets

on:
  push:
    branches:
      - asset-import-transfer-20260904
    paths:
      - .github/asset-import-trigger

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify manifest assets
        shell: bash
        run: |
          set -euo pipefail
          manifest='.github/asset-import-manifest.tsv'
          test -s "$manifest"

          count=0
          while IFS=$'\t' read -r path expected url || [[ -n "${path:-}" ]]; do
            [[ -z "${path:-}" || "${path:0:1}" == '#' ]] && continue

            if ! [[ "$path" =~ ^assets/(default|cheer|rest|away|warning|leave|stats|settings|alert|profile)/(default|cheer|rest|away|warning|leave|stats|settings|alert|profile)_[0-9]{2}\.png$ ]]; then
              echo "Unsafe or unexpected asset path: $path" >&2
              exit 1
            fi
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid SHA-256 for $path" >&2; exit 1; }
            [[ "$url" == https://* ]] || { echo "Invalid source URL for $path" >&2; exit 1; }

            mkdir -p "$(dirname "$path")"
            curl -fL --retry 3 --retry-delay 1 "$url" -o "$path"
            echo "$expected  $path" | sha256sum -c -
            count=$((count + 1))
          done < "$manifest"

          [[ "$count" -eq 10 ]] || { echo "Expected exactly 10 assets, got $count" >&2; exit 1; }

      - name: Commit verified assets to transfer branch
        shell: bash
        run: |
          set -euo pipefail
          manifest='.github/asset-import-manifest.tsv'
          mapfile -t paths < <(awk -F '\t' 'NF >= 3 && $1 !~ /^#/ && $1 != "" {print $1}' "$manifest")
          [[ "${#paths[@]}" -eq 10 ]] || { echo "Expected exactly 10 manifest paths" >&2; exit 1; }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"

          mapfile -t staged < <(git diff --cached --name-only)
          [[ "${#staged[@]}" -eq 10 ]] || { printf 'Expected exactly 10 staged files, got %s\n' "${#staged[@]}" >&2; printf '%s\n' "${staged[@]}"; exit 1; }

          label="$(head -n 1 .github/asset-import-trigger | tr -cd '[:alnum:]_.-')"
          [[ -n "$label" ]] || label='asset-set'
          git commit -m "Stage character asset variant ${label}"
          git push
