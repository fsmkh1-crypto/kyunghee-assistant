          git add assets/default/default_01.png assets/cheer/cheer_01.png assets/rest/rest_01.png assets/away/away_01.png assets/warning/warning_01.png assets/leave/leave_01.png assets/stats/stats_01.png assets/settings/settings_01.png assets/alert/alert_01.png assets/profile/profile_01.png
