name: Apply Phase 6 presentation deferral

on:
  push:
    paths:
      - 'tools/apply_phase6_presentation_deferral.py'
      - '.github/workflows/apply-phase6-presentation-deferral.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/dark-kyunghee-redesign
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply patch
        run: python tools/apply_phase6_presentation_deferral.py
      - name: Compile and test
        run: |
          python -m py_compile break_reminder.py app.py desktop_compact.py
          python -m unittest discover -s tests -v
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add break_reminder.py app.py desktop_compact.py tests/test_break_reminder.py PHASE6_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Fix fullscreen break reminder deferral'
            git push origin HEAD:ui/dark-kyunghee-redesign
          fi
