name: Layered Alpha POC

on:
  workflow_dispatch:
  push:
    branches:
      - ui/dark-kyunghee-redesign
    paths:
      - 'tools/layered_alpha_poc.py'
      - 'tools/test_layered_alpha_poc.py'
      - '.github/workflows/layered-alpha-poc.yml'
      - 'assets/**'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install POC dependencies
        run: python -m pip install Pillow pyinstaller
      - name: Compile and test alpha POC
        run: |
          python -m py_compile tools/layered_alpha_poc.py tools/test_layered_alpha_poc.py
          python tools/test_layered_alpha_poc.py
      - name: Smoke-test native layered window
        run: python tools/layered_alpha_poc.py --duration 1 --x -32000 --y -32000
      - name: Build standalone visual POC
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name KyungheeAlphaPoc
          --add-data "assets;assets"
          tools/layered_alpha_poc.py
      - name: Smoke-test packaged visual POC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $process = Start-Process -FilePath dist\KyungheeAlphaPoc.exe -ArgumentList '--duration','1','--x','-32000','--y','-32000' -PassThru
          if (-not $process.WaitForExit(15000)) {
            Stop-Process -Id $process.Id -Force
            throw "Packaged layered-alpha POC did not exit after its smoke-test duration."
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged layered-alpha POC exited with code $($process.ExitCode)."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: kyunghee-layered-alpha-poc
          path: dist/KyungheeAlphaPoc.exe
          retention-days: 14
