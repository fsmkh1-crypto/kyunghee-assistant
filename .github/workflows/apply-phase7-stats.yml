name: Apply Phase 7 recent stats

on:
  push:
    branches:
      - ui/dark-kyunghee-redesign
    paths:
      - '.github/workflows/apply-phase7-stats.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/dark-kyunghee-redesign
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Phase 7 UI and status patch
        run: python tools/apply_phase7_stats.py
      - name: Compile and test
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile state.py stats_summary.py desktop_app.py desktop_compact.py
          python -m unittest discover -s tests -v
      - name: Commit final Phase 7 start
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop_app.py PROJECT_PHASES.md
          git rm .github/workflows/apply-phase7-stats.yml tools/apply_phase7_stats.py
          git commit -m "Start Phase 7 recent stats"
          git push origin HEAD:ui/dark-kyunghee-redesign
